# Committed device profiles — override machine-specific fields in device.local.toml
# (add .cargo/device.local.toml to your .gitignore)

[device.desktop]
# Native build, no deployment

[device.radxa]
target = "aarch64-unknown-linux-gnu"
linker = "aarch64-linux-gnu-gcc"      # apt: gcc-aarch64-linux-gnu (Linux/macOS host)
ssh_host = "<USER>@<DEVICE_IP>"   # set real value in device.local.toml
ssh_key  = "~/.ssh/id_ed25519"        # set real value in device.local.toml
deploy_path = "/home/radxa"

# Windows host: `linker` above is a Linux binary, so build in Docker via cross instead.
# A field cannot be un-set from device.local.toml (overrides replace, never remove), so
# give Windows its own device rather than trying to clear `linker`:
#
# [device.radxa-win]
# target = "aarch64-unknown-linux-gnu"
# cross = true
# ssh_host = "<USER>@<DEVICE_IP>"
# deploy_path = "/home/radxa"
#
# Transfer needs no extra tools: transport "auto" falls back to OpenSSH's sftp when rsync
# is absent. Add these only if Git's MSYS ssh is also on PATH and you want the Windows one:
# ssh_program  = "C:/Windows/System32/OpenSSH/ssh.exe"
# sftp_program = "C:/Windows/System32/OpenSSH/sftp.exe"
