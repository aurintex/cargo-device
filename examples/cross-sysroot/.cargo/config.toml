# Docker-free cross-compilation to an aarch64 device whose glibc is OLDER than the host's.
#
# This example shows two ways to match the target's glibc without `cross`/Docker, plus the
# Docker fallback. Machine-specific absolute paths (sysroot/toolchain/SSH) belong in
# .cargo/device.local.toml (gitignored) — see this example's README.

[device.desktop]
# Native build, no deployment.

# ── Approach A: link against a sysroot copied from the device ────────────────────────────────
# Exact device glibc, and resolves any system/C libraries the device already has (e.g. ROS 2).
# Needs the host apt package `gcc-aarch64-linux-gnu` and a sysroot rsync'd from the device.
[device.edge]
target = "aarch64-unknown-linux-gnu"
linker = "aarch64-linux-gnu-gcc"
# sysroot + the sysroot -L/-rpath-link are per-machine (absolute) → device.local.toml. A multiarch
# host gcc needs the sysroot's libc on the search path first (see README "Multiarch host-gcc caveat").
rustflags = ["-C", "link-arg=-Wl,--allow-shlib-undefined"]
ssh_host = "user@device.local"          # override in device.local.toml
ssh_key = "~/.ssh/id_ed25519"
deploy_path = "/home/user/app"

[device.edge.env]
# Only needed when a dependency's build script requires them (example: ROS 2 / rclrs).
# AMENT_PREFIX_PATH = "~/sysroots/edge/opt/ros/humble"
# ROS_DISTRO = "humble"

# ── Approach B: prebuilt toolchain whose bundled glibc is <= the device's ─────────────────────
# A Bootlin "stable" SDK ships gcc + a complete sysroot at a fixed glibc version.
# aarch64--glibc--stable-2021.11-1 → glibc 2.34 (runs on any device with glibc >= 2.34).
[device.edge-bootlin]
target = "aarch64-unknown-linux-gnu"
# linker + sysroot point into the extracted toolchain → set the real paths in device.local.toml:
#   linker  = "/opt/aarch64--glibc--stable-2021.11-1/bin/aarch64-buildroot-linux-gnu-gcc"
#   sysroot = "/opt/aarch64--glibc--stable-2021.11-1/aarch64-buildroot-linux-gnu/sysroot"
rustflags = ["-C", "link-arg=-Wl,--allow-shlib-undefined"]
ssh_host = "user@device.local"
ssh_key = "~/.ssh/id_ed25519"
deploy_path = "/home/user/app"

# ── Fallback: cross (Docker) ──────────────────────────────────────────────────────────────────
# Uses the cross image's own (old) sysroot. Pass build-script env via Cross.toml env.passthrough.
[device.edge-cross]
target = "aarch64-unknown-linux-gnu"
cross = true
